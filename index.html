<html>
<head> 
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script> 
<script src="https://c-frame.github.io/aframe-physics-system/dist/aframe-physics-system.js"></script> 
</head>
<body>
<a-scene id="s1" fog="color: silver; near: 0" animation="property: fog.far; to: 5; dur: 50000; easing: easeOutQuad">
<a-entity id="gasSound"
sound="src: url(sounds/soundreality-gas-stove-burner-450981.mp3); autoplay: false; loop: true; volume: 0.5"
></a-entity>
<a-plane static-body width="40" height="8" position="-20 4 0" rotation="0 90 0">
<a-box id="window" focusing color="silver" opacity="0.5" scale="1.25 1.25 0.5" position="-15 2 -0.2"
sound="src: url(sounds/mixkit-glass-break-with-hammer-thud-759.wav)">
<a-light distance="1" type="spot" position="0 0 1"></a-light>
<a-light angle="90" intensity="0.01" type="spot" position="0 0 -1" rotation="180 0 0"></a-light>
</a-box>
<a-text value="FRAGILE" position="-15 1 0" rotation="0 0 0" align="center" color="brown" width="4" wrap-count="10" scale="0.25 0.25 0.25"></a-text>
</a-plane>
<a-plane static-body width="40" height="8" position="20 4 0" rotation="0 -90 0"></a-plane> 
<a-plane static-body width="40" height="8" position="0 4 20" material="side:back"></a-plane>
<a-plane static-body width="40" height="8" position="0 4 -20"></a-plane>
<a-plane static-body width="40" height="40" position="0 0 0" rotation=" -90 0 0"></a-plane>
<a-plane static-body width="40" height="40" position="0 8 0" rotation="90 0 0"></a-plane>
<a-plane id="door" focusing height="4" width="2" color="darkgreen" position="0 2 -19.9" 
sound="src: url(sounds/mixkit-locking-a-shop-door-with-keys-202.wav)">
<a-ring color="black" radius-inner="0.01" radius-outer="0.1" position="0.75 0 0.01"></a-ring>
</a-plane>
<a-plane id="wrongdoor1" focusing height="4" width="2" color="royalblue" position="-19.9 2 0" rotation="0 90 0">
<a-ring color="black" radius-inner="0.01" radius-outer="0.1" position="0.75 0 0.01"></a-ring>
</a-plane>
<a-plane id="wrongdoor2" focusing height="4" width="2" color="gold" position="19.9 2 0" rotation="0 -90 0">
<a-ring color="black" radius-inner="0.01" radius-outer="0.1" position="0.75 0 0.01"></a-ring>
</a-plane>
<a-plane id="wrongdoor3" focusing height="4" width="2" color="pink" position="0 2 19.9" rotation="0 180 0">
<a-ring color="black" radius-inner="0.01" radius-outer="0.1" position="0.75 0 0.01"></a-ring>
</a-plane>
<a-camera id="cam">
<a-entity id="audioStart"></a-entity>
<a-text updating value="" align="center" position="0 0.5 -1" scale="0.45 0.45 0.45">
</a-text>
<a-cone static-body height="2" position="0 -1 0"></a-cone>
<a-cursor color="yellow" fuse="true" far="10"></a-cursor>
<a-light id="light" distance="20" intensity="0.25" type="spot" penumbra="0.5" visible="false"></a-light>
</a-camera>
  <script>
var locked = true, tool = false, gas = true, message = "", time = 6000;
var gemFound = false;
document.addEventListener('click', function () {
let gasSound = document.querySelector('#gasSound');
if (gasSound && gasSound.components.sound) { gasSound.components.sound.playSound();}
}, { once: true });  
AFRAME.registerComponent('updating', {
tick: function () {
if (gas) time--;
if (time < 0) message = "Game over...";
if (message != "") this.el.setAttribute('value', message);
else this.el.setAttribute('value', + Math.round(time / 100));
var pos = document.getElementById('cam').getAttribute('position');
if (pos.x < -19) pos.x= -19;
if (pos.x > 19) pos.x = 19;
if (pos.z < -19) pos.z = -19;
if (pos.z > 19) pos.z = 19;
document.getElementById('cam').setAttribute('position', pos);
}
});
</script>
<a-cylinder dynamic-body id="hammer" color="tan" height="0.5" radius="0.05" focusing>
<a-box color="black" width="0.5" height="0.1" depth="0.1" position="0 0.25 0"></a-box>
</a-cylinder>
<a-cylinder dynamic-body id="key" color="silver" height="0.15" radius="0.01" focusing>
<a-box color="silver" scale="0.04 0.03 0.02" position="0.02 0.04 0"></a-box>
<a-torus color="silver" radius="0.03" radius-tubular="0.003" position="0 -0.1 0"></a-torus>
</a-cylinder>
<a-cylinder dynamic-body id="torch" height="0.5" radius="0.1" rotation="90 0 0" focusing>
<a-cone height="0.2" radius-top="0.1" radius-bottom="0.2" position="0 0.2 0" rotation="180 0 0"></a-cone>
<a-light distance="20" intensity="0.25" type="spot" penumbra="0.5" position="0 0.2 0" 
  rotation="90 0 0"></a-light>
<a-light distance="0.3" type="spot" position="0 0 40" rotation="-90 0 0"></a-light>
</a-cylinder>
<a-sphere dynamic-body id="gem" radius="0.2" color="purple" focusing position="0 2 0" material="emissive: purple; emissiveIntensity: 0.8">
</a-sphere>
<a-entity id="barrel" dynamic-body>
 <a-cylinder radius="0.5" height="0.3" position="0 0.45 0" color="saddlebrown"></a-cylinder>
  <a-cylinder radius="0.65" height="0.6" position="0 0 0" color="sienna"></a-cylinder>
  <a-cylinder radius="0.5" height="0.3" position="0 -0.45 0" color="saddlebrown"></a-cylinder>
<a-torus radius="0.56" radius-tubular="0.03" rotation="90 0 0" position="0 0.4 0" color="dimgray"></a-torus>
<a-torus radius="0.56" radius-tubular="0.03" rotation="90 0 0" position="0 0 0" color="dimgray"></a-torus>
<a-torus radius="0.56" radius-tubular="0.03" rotation="90 0 0" position="0 -0.4 0" color="dimgray"></a-torus>
</a-entity>
<a-box dynamic-body id="table" color="brown" scale="3 0.2 3" position="-10 2 -10">
    <a-cylinder height="6" radius="0.03" position="-0.4 -3 -0.4"></a-cylinder>
    <a-cylinder height="6" radius="0.03" position="-0.4 -3 0.4"></a-cylinder>
    <a-cylinder height="6" radius="0.03" position="0.4 -3 -0.4"></a-cylinder>
    <a-cylinder height="6" radius="0.03" position="0.4 -3 0.4"></a-cylinder>
</a-box>
<a-box dynamic-body id="chair" color="brown" scale="1 0.1 1" position="10 1.5 10">
<a-cylinder height="8" radius="0.05" position="-0.4 -4 -0.4"></a-cylinder>
<a-cylinder height="8" radius="0.05" position="-0.4 -4 0.4"></a-cylinder>
<a-cylinder height="19" radius="0.05" position="0.4 2 -0.4"></a-cylinder>
<a-cylinder height="19" radius="0.05" position="0.4 2 0.4"></a-cylinder>
<a-box class="backrest" color="brown" scale="0.05 5 1" position="0.4 8 0"></a-box>
</a-box>
  <script>
var scene1 = document.getElementById('s1');
var tableColors = ["brown","purple","gold","royalblue","orange","teal","deeppink","darkgreen","violet","darkorange"];
for (var i = 0; i < 15; i++) {
var t= document.getElementById('table').cloneNode(true);
var x = Math.random() * 40 - 20;
var z = Math.random() * 40 - 20;
var tableColor = tableColors[Math.floor(Math.random() * tableColors.length)];
t.setAttribute('color', tableColor);
t.setAttribute('position', x + ' 2 ' + z);
t.setAttribute('rotation', '0 ' + Math.random() * 90 + ' 0');
scene1.appendChild(t);
}
for (var i = 0; i < 25; i++) {
var c = document.getElementById('chair').cloneNode(true);
var chairColors = ["royalblue","gold","purple","orange","teal","limegreen","deeppink","brown","darkgreen","magenta","cyan"];
var chairColor = chairColors[Math.floor(Math.random() * chairColors.length)];
c.setAttribute('color', chairColor);
c.querySelector('.backrest').setAttribute('color', chairColor);
var x = Math.random() * 40 - 20;
var z = Math.random() * 40 - 20;
c.setAttribute('position', x +' 6 ' + z);
scene1.appendChild(c);
var scene1 = document.getElementById('s1');
}  
for (var i = 0; i < 25; i++) {
var b = document.getElementById('barrel').cloneNode(true);
var barrelColors = ["sienna", "brown", "maroon", "chocolate"];
b.setAttribute('color', barrelColors[Math.floor(Math.random() * barrelColors.length)]);
var x = Math.random() * 40 - 20;
var z = Math.random() * 40 - 20;
b.setAttribute('position', x + ' 0.6 ' + z);
b.setAttribute('rotation', '0 ' + Math.random() * 360 + ' 0');
scene1.appendChild(b);
}
document.getElementById('hammer').setAttribute('position', (Math.random() * 30 - 15) + ' 5 ' + (Math.random() * 30 - 15));
document.getElementById('torch').setAttribute('position', (Math.random() * 30 - 15) + ' 3 ' + (Math.random() * 30 -15));
document.getElementById('key').setAttribute('position', (Math.random() * 30 - 15) + ' 1 ' + (Math.random() * 30 - 15));
document.getElementById('gem').setAttribute('position', (Math.random() * 30 - 15) + ' 2 ' + (Math.random() * 30 - 15));
</script>
<script>
  AFRAME.registerComponent('focusing', {
init: function () {
var el = this.el;
el.addEventListener('mouseenter', function () {
if (el.id == "gem") {
if (!gemFound) {gemFound = true;
message = "RULES FOUND:\n" + 
"- Find the torch\n" +
"- Find the hammer and use it to stop the gas\n" +
"- Find the key and unlock the correct door";
setTimeout(function () {
if (message.includes("RULES FOUND")) {message = ""; }}, 8000);}
return;
}
var pos = document.getElementById('cam').getAttribute('position');
if (el.id == "door") {
if (!locked && time >= 0) { el.components.sound.playSound(); message = "Well done, you escaped!"; }
return;
 }
if (el.id == "wrongdoor1") {
if (!locked && time >= 0) { message = "Wrong door!"; 
setTimeout(function () { if (message == "Wrong door!") { message = ""; }}, 3000);
}
return;
 }
if (el.id == "wrongdoor2") {
if (!locked && time >= 0) {  message = "Try another door"; 
setTimeout(function () { if (message == "Try another door") { message = ""; }}, 3000);
}
return;
 }
if (el.id == "wrongdoor3") {
if (locked) return; { message = "This option is now gone";
setTimeout(function () { if (message === "This option is now gone") {message = ""; }}, 3000);
}
el.removeAttribute('dynamic-body');
el.setAttribute('animation', 'property: position; to:' + pos.x + ' 1 ' + pos.z);
return;
}
else if (el.id == "window") {
if (tool) {
document.querySelector('a-scene').removeAttribute('animation');
document.querySelector('a-scene').setAttribute('animation', 'property: fog.far; to: 1000; dur: 60000');
gas = false;
const gasSound = document.querySelector('#gasSound');
if (gasSound && gasSound.components && gasSound.components.sound) {
  gasSound.components.sound.stopSound();
}
el.components.sound.playSound(); el.setAttribute('blending', 'subtractive');
 }
return;
 }
el.removeAttribute('dynamic-body');
el.setAttribute('animation', 'property: position; to:' + pos.x + ' 1 ' + pos.z);
if (el.id == "torch") document.getElementById('light').setAttribute('animation', 'property: visible; to: true');
else if (el.id == "key") locked = false;
else if (el.id == "hammer") tool = true;
setTimeout(function () { el.remove(); }, 3000);
 });
}
 });  
</script>
  </a-scene>
</body>
</html>
